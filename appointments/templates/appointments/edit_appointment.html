{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-warning text-dark">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-edit me-2"></i>
                        <h4 class="mb-0">Editar Cita</h4>
                    </div>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="{{ form.title.id_for_label }}" class="form-label fw-bold">
                                        <i class="fas fa-tag me-1 text-warning"></i>{{ form.title.label }}
                                    </label>
                                    {{ form.title }}
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="{{ form.specialty.id_for_label }}" class="form-label fw-bold">
                                        <i class="fas fa-stethoscope me-1 text-warning"></i>Especialidad
                                    </label>
                                    <select name="specialty" id="id_specialty" class="form-select">
                                        {% if frequent %}
                                        <optgroup label="🏥 Tus especialidades frecuentes">
                                            {% for s in frequent %}
                                                <option value="{{ s }}" {% if form.instance.specialty == s %}selected{% endif %}>{{ s }}</option>
                                            {% endfor %}
                                        </optgroup>
                                        {% endif %}
                                        <optgroup label="🩺 Otras especialidades">
                                            {% for s in others %}
                                                <option value="{{ s }}" {% if form.instance.specialty == s %}selected{% endif %}>{{ s }}</option>
                                            {% endfor %}
                                        </optgroup>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="{{ form.date.id_for_label }}" class="form-label fw-bold">
                                        <i class="fas fa-calendar me-1 text-warning"></i>{{ form.date.label }}
                                    </label>
                                    {{ form.date }}
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="{{ form.time.id_for_label }}" class="form-label fw-bold">
                                        <i class="fas fa-clock me-1 text-warning"></i>{{ form.time.label }}
                                    </label>
                                    {{ form.time }}
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="{{ form.doctor_name.id_for_label }}" class="form-label fw-bold">
                                <i class="fas fa-user-md me-1 text-warning"></i>{{ form.doctor_name.label }}
                            </label>
                            {{ form.doctor_name }}
                        </div>

                        <div class="mb-3">
                            <label for="{{ form.address.id_for_label }}" class="form-label fw-bold">
                                <i class="fas fa-map-marker-alt me-1 text-warning"></i>{{ form.address.label }}
                            </label>
                            {{ form.address }}
                        </div>

                        <div class="mb-4">
                            <label for="{{ form.description.id_for_label }}" class="form-label fw-bold">
                                <i class="fas fa-comment me-1 text-warning"></i>{{ form.description.label }}
                            </label>
                            {{ form.description }}
                        </div>

                        <div class="d-flex gap-2 justify-content-end">
                            <a href="{% url 'appointment_list' %}" class="btn btn-outline-secondary">
                                <i class="fas fa-times me-1"></i>Cancelar
                            </a>
                            <button type="submit" class="btn btn-warning">
                                <i class="fas fa-save me-1"></i>Guardar Cambios
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Font Awesome para iconos -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
{% endblock %}
