<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration - Preventix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #3b82f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .register-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .header-logo {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .form-label {
            color: #1e3c72;
            font-weight: 600;
        }
        
        .form-control:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.25);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #3b82f6 100%);
            border: none;
            border-radius: 12px;
            font-weight: 600;
            padding: 12px 30px;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #3b82f6 100%);
        }
        
        .btn-outline-primary {
            border-color: #3b82f6;
            color: #3b82f6;
            border-radius: 12px;
            font-weight: 600;
            padding: 12px 30px;
            transition: all 0.3s ease;
        }
        
        .btn-outline-primary:hover {
            background-color: #3b82f6;
            border-color: #3b82f6;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
        }
        
        .text-success {
            color: #3b82f6 !important;
        }
        
        .alert-danger {
            background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
            border: 1px solid #f87171;
            border-radius: 12px;
            color: #dc2626;
        }
        
        .card-header {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            border-bottom: 2px solid #e2e8f0;
        }
        
        .form-control {
            border-radius: 10px;
            border: 2px solid #e2e8f0;
            padding: 12px 16px;
            transition: all 0.3s ease;
        }
        
        .form-control:hover {
            border-color: #3b82f6;
        }
        
        .icon-blue {
            color: #3b82f6 !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card register-card border-0 shadow-lg">
                    <div class="card-header bg-transparent text-center py-4">
                        <div class="d-flex align-items-center justify-content-center mb-3">
                            <i class="fas fa-heartbeat icon-blue me-2" style="font-size: 2rem;"></i>
                            <h2 class="header-logo mb-0 fw-bold">Preventix</h2>
                        </div>
                        <h4 class="text-muted">Crear Nueva Cuenta</h4>
                    </div>
                    
                    <div class="card-body p-4">
                        <!-- Mostrar mensajes de error -->
        {% if messages %}
                            <div class="alert alert-danger" role="alert">
        {% for message in messages %}
                                    <i class="fas fa-exclamation-triangle me-2"></i>{{ message }}
        {% endfor %}
                            </div>
{% endif %}

        <form action="/register/" method="post">
            {% csrf_token %}
                            
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="name" class="form-label fw-bold">
                                            <i class="fas fa-user me-1 icon-blue"></i>Nombre Completo
                                        </label>
                                        <input type="text" 
                                               id="name" 
                                               name="name" 
                                               class="form-control form-control-lg" 
                                               placeholder="Juan David Montoya López" 
                                               required>
                                    </div>
                                </div>
                                
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="age" class="form-label fw-bold">
                                            <i class="fas fa-birthday-cake me-1 icon-blue"></i>Edad
                                        </label>
                                        <input type="number" 
                                               id="age" 
                                               name="age" 
                                               class="form-control form-control-lg" 
                                               placeholder="33" 
                                               min="0" 
                                               required>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="email" class="form-label fw-bold">
                                            <i class="fas fa-envelope me-1 icon-blue"></i>Correo Electrónico
                                        </label>
                                        <input type="email" 
                                               id="email" 
                                               name="email" 
                                               class="form-control form-control-lg" 
                                               placeholder="juandamonto@yahoo.com" 
                                               required>
                                    </div>
                                </div>
                                
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="phone" class="form-label fw-bold">
                                            <i class="fas fa-phone me-1 icon-blue"></i>Celular
                                        </label>
                                        <input type="text" 
                                               id="phone" 
                                               name="phone" 
                                               class="form-control form-control-lg" 
                                               placeholder="3152347681" 
                                               required>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-12">
                                    <div class="mb-3">
                                        <label for="address" class="form-label fw-bold">
                                            <i class="fas fa-map-marker-alt me-1 icon-blue"></i>Dirección
                                        </label>
                                        <input type="text" 
                                               id="address" 
                                               name="address" 
                                               class="form-control form-control-lg" 
                                               placeholder="Calle 123 #45-67, Barrio Centro, Medellín" 
                                               required>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="password" class="form-label fw-bold">
                                            <i class="fas fa-lock me-1 icon-blue"></i>Contraseña
                                        </label>
                                        <input type="password" 
                                               id="password" 
                                               name="password" 
                                               class="form-control form-control-lg" 
                                               placeholder="Tu contraseña" 
                                               required>
                                    </div>
                                </div>
                                
                                <div class="col-md-6">
                                    <div class="mb-4">
                                        <label for="confirm_password" class="form-label fw-bold">
                                            <i class="fas fa-lock me-1 icon-blue"></i>Confirmar Contraseña
                                        </label>
                                        <input type="password" 
                                               id="confirm_password" 
                                               name="confirm_password" 
                                               class="form-control form-control-lg" 
                                               placeholder="Confirma tu contraseña" 
                                               required>
                                    </div>
                                </div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-success btn-lg">
                                    <i class="fas fa-user-plus me-2"></i>Comenzar con Preventix
                                </button>
                            </div>
        </form>
                        
                        <hr class="my-4">
                        
                        <div class="text-center">
                            <p class="text-muted mb-0">¿Ya tienes cuenta?</p>
                            <a href="/login/" class="btn btn-outline-primary">
                                <i class="fas fa-sign-in-alt me-1"></i>Iniciar Sesión
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
